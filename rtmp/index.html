<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Stream</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
  </head>
  <body>
    <h2>Live Stream</h2>

    <media-controller>
      <video id="video" slot="media" autoplay muted></video>
      <media-control-bar>
        <media-play-button></media-play-button>
        <media-mute-button></media-mute-button>
        <media-time-range></media-time-range>
        <media-time-display></media-time-display>
        <!-- <media-fullscreen-button></media-fullscreen-button> -->
      </media-control-bar>
    </media-controller>
    <!-- <video id="video" width="640" height="360" controls autoplay muted></video> -->

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
      var video = document.getElementById("video");
      var videoSrc = "http://localhost:8080/hls/test.m3u8";
      if (Hls.isSupported()) {
        // var hls = new Hls({ enableWorker: false });
        var hls = new Hls({ 
            liveSyncDuration: 2,          // 同步延遲 2 秒
            liveMaxLatencyDuration: 4,   // 最大延遲 4 秒
            maxBufferLength: 10,         // 緩衝區限制為 10 秒
         });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
      }
      else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = videoSrc;
      }
      // hls.js is not supported on platforms that do not have Media Source
      // Extensions (MSE) enabled.
      //
      // When the browser has built-in HLS support (check using `canPlayType`),
      // we can provide an HLS manifest (i.e. .m3u8 URL) directly to the video
      // element through the `src` property. This is using the built-in support
      // of the plain video element, without using hls.js.
      //
      // Note: it would be more normal to wait on the 'canplay' event below however
      // on Safari (where you are most likely to find built-in HLS support) the
      // video.src URL must be on the user-driven white-list before a 'canplay'
      // event will be emitted; the last video event that can be reliably
      // listened-for when the URL is not on the white-list is 'loadedmetadata'.
    </script>
  </body>
</html>
